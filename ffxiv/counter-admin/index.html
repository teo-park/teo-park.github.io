<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>조회 통계 · 파판14 도구함</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../theme.css?v=20260909-line1">
  <link rel="stylesheet" href="./styles.css?v=20260915-private1">
</head>
<body>
  <main>
    <header><a href="../">파판14 도구함 ↗</a><span>관리자 전용</span></header>
    <h1>조회 통계</h1>
    <p class="intro">전체 조회 수와 페이지별 이용 현황을 확인합니다.</p>
    <section id="loginPanel" class="panel">
      <h2>관리자 로그인</h2>
      <p>허용된 Google 계정으로 로그인하세요.</p>
      <button id="login" disabled>Google 계정으로 로그인</button>
    </section>
    <p id="status" role="status" aria-live="polite">로그인 기능을 준비하고 있습니다.</p>
    <section id="dashboard" hidden>
      <div class="toolbar"><span id="account"></span><div><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div></div>
      <div class="panel total"><span>전체 조회</span><strong id="total">—</strong><small id="updated"></small></div>
      <div class="panel table-panel"><table><caption>페이지별 조회 수</caption><thead><tr><th scope="col">페이지</th><th scope="col">조회</th><th scope="col">비중</th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="note">같은 브라우저의 같은 페이지는 30분에 한 번 집계합니다. 전체 조회는 페이지별 합계로, 고유 방문자 수와 다릅니다. 근해·원양은 먼바다로 합산합니다. 집계 이전의 방문은 포함하지 않습니다.</p>
    </section>
    <noscript>통계를 확인하려면 JavaScript를 켜 주세요.</noscript>
  </main>
  <script src="./model.js?v=20260915-private1"></script>
  <script src="./controller.js?v=20260915-private1"></script>
  <script type="module" src="./app.js?v=20260915-private1"></script>
</body>
</html>
